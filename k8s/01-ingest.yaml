# AVERA-ATLAS Ingest Service
# Holds the CDM store and serves the reference CDM path.
# SCRUM-431: Space-Track is retired; the poll, its client and the
# spacetrack-credentials secret are gone. No secret is required.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  namespace: avera-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest
  template:
    metadata:
      labels:
        app: ingest
    spec:
      containers:
      - name: ingest
        image: avera/ingest:v6
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: OUTPUT_DIR
          value: "/data/planner_artifacts"
        volumeMounts:
        - name: planner-data
          mountPath: /data/planner_artifacts
        - name: cdm-data
          mountPath: /data/cdm_store
      volumes:
      - name: planner-data
        hostPath:
          path: /opt/avera/data
          type: DirectoryOrCreate
      - name: cdm-data
        hostPath:
          path: /opt/avera/cdm
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-service
  namespace: avera-system
spec:
  selector:
    app: ingest
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
