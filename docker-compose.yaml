services:
  ingest:
    build: {context: ./services/ingest}
    image: avera/ingest:v6
    ports: ["8001:8000"]
    environment:
      - OUTPUT_DIR=/data/planner_artifacts
    volumes:
      - planner_data:/data/planner_artifacts
      - cdm_data:/data/cdm_store
    restart: unless-stopped

  detector:
    build: {context: ./services/detector}
    image: avera/detector:v6
    ports: ["8000:8000"]
    depends_on: [tracker]
    restart: unless-stopped

  physics-classifier:
    build:
      context: ./services/physics-classifier
    image: avera/physics-classifier:v1
    container_name: avera-physics-classifier
    ports: ["8003:8000"]
    environment:
      - TRACKER_HOST=tracker
      - TRACKER_PORT=8000
    depends_on: [tracker]
    restart: unless-stopped

  tracker:
    build: {context: ./services/tracker}
    image: avera/tracker:v6
    ports: ["8002:8000"]
    environment: [DATA_DIR=/data/planner_artifacts]
    volumes: [planner_data:/data/planner_artifacts]
    depends_on: [ingest]
    restart: unless-stopped

  propagator:
    build: {context: ., dockerfile: services/propagator/Dockerfile}   # SCRUM-388: root context for libs/aps_math
    image: avera/propagator:v6
    environment: [DATA_DIR=/data/planner_artifacts]
    volumes: [planner_data:/data/planner_artifacts]
    depends_on: [tracker]
    restart: unless-stopped

  planner:
    build: {context: ., dockerfile: services/planner/Dockerfile}   # SCRUM-388: root context for libs/aps_math
    image: avera/planner:v6
    ports: ["8060:8060"]
    environment:
      - INGEST_SERVICE_URL=http://ingest:8000
      - UDL_USER=${UDL_USER}
      - UDL_PASS=${UDL_PASS}
      - UDL_ENABLED=${UDL_ENABLED}
      - LEOLABS_ENABLED=${LEOLABS_ENABLED}
      - LEOLABS_ACCESS_KEY=${LEOLABS_ACCESS_KEY}
      - LEOLABS_SECRET_KEY=${LEOLABS_SECRET_KEY}
      - LEOLABS_ASSET_NORADS=${LEOLABS_ASSET_NORADS}
    depends_on: [propagator]
    restart: unless-stopped

  viz:
    build: {context: ./services/viz}
    image: avera/viz:v6
    environment: [DATA_DIR=/data/planner_artifacts]
    volumes: [planner_data:/data/planner_artifacts]
    depends_on: [propagator]
    restart: unless-stopped

  ui:
    build: {context: ./services/ui}
    image: avera/ui:v6
    ports: ["8080:8000"]
    environment:
      - SWIR_SERVICE_URL=http://detector:8000/predict
      - PHYSICS_CLASSIFIER_URL=http://physics-classifier:8000/predict
      - TRACKER_SERVICE_URL=http://tracker:8000
      - PLANNER_SERVICE_URL=http://planner:8060
      - INGEST_SERVICE_URL=http://ingest:8000
      - DATA_DIR=/data/planner_artifacts
    depends_on: [detector, tracker, planner, physics-classifier]
    volumes: [planner_data:/data/planner_artifacts]
    restart: unless-stopped

volumes:
  planner_data:
    driver: local
  cdm_data:
    driver: local
